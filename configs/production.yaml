# Production configuration file for the Tool to sync an Apple TV playlist to the Infuse app application.

General:
  AppName: ipad-sync
  CheckInterval: 30
  SimulationMode: False

Files:
  LogfileName: logs/logfile.log
  LogfileMaxLines: 10000
  LogProcessID: False
  LogfileVerbosity: detailed
  ConsoleVerbosity: detailed

Email:
  EnableEmail: True
  SubjectPrefix: "[ipad-sync]: "

HeartbeatMonitor:
  Enable: False
  WebsiteURL:
  HeartbeatTimeout: 5

AppleTV:
  Playlist: "iPad Sync"
  MediaFolder: "/Volumes/Data_Mobile/Multimedia/Video"

iPad:
  AppName: "Infuse"
  # BundleID: "com.firecore.infuse"
  MinimumFreeSpaceGB: 1