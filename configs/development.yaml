# Development configuration file for the Tool to sync an Apple TV playlist to the Infuse app application.

General:
  AppName: ipad-sync
  CheckInterval: 4

Files:
  LogfileName: logs/logfile.log
  LogfileMaxLines: 10000
  LogProcessID: False
  LogfileVerbosity: debug
  ConsoleVerbosity: debug

Email:
  EnableEmail: True
  SubjectPrefix: "[Dev ipad-sync]: "


HeartbeatMonitor:
  Enable: True
  WebsiteURL: https://uptime.betterstack.com/api/v1/heartbeat/zcsNtnEQHRDNWJENvcZc94fx
  HeartbeatTimeout: 5